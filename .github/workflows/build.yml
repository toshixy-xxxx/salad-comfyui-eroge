name: build-salad-comfyui-image

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      comfyui_dir: ${{ steps.find.outputs.dir }}
    steps:
      - name: Probe base image layout
        id: find
        run: |
          docker pull ghcr.io/saladtechnologies/comfyui-api:comfy0.7.0-api1.16.1-torch2.8.0-cuda12.8-runtime
          DIR=$(docker run --rm --entrypoint bash ghcr.io/saladtechnologies/comfyui-api:comfy0.7.0-api1.16.1-torch2.8.0-cuda12.8-runtime -c 'for d in /comfyui /app/ComfyUI /opt/ComfyUI /workspace/ComfyUI; do [ -d "$d/models" ] && echo "$d" && break; done; find / -maxdepth 4 -type d -name checkpoints 2>/dev/null | head -3')
          echo "probe output: $DIR"
          ROOT=$(echo "$DIR" | head -1)
          case "$ROOT" in */models) ROOT=$(dirname "$ROOT");; esac
          if [ -z "$ROOT" ]; then echo "could not locate ComfyUI models dir"; exit 1; fi
          echo "dir=$ROOT" >> "$GITHUB_OUTPUT"

  build:
    needs: probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            COMFYUI_DIR=${{ needs.probe.outputs.comfyui_dir }}
          tags: ghcr.io/${{ github.repository_owner }}/salad-comfyui-eroge:latest
